# OPC 运行时适配配置 — Pi (Mario Zechner)
# 此配置定义如何从 prompts/（唯一真相源）生成 Pi 运行时的 Agent 定义文件。
# 生成器：scripts/generate-agents.py --runtime=pi
# 前置条件：Pi 需安装 subagent 扩展（如 pi-subagent / pi-agent-suite）

runtime: pi
name: Pi
description: "Pi 运行时适配 — markdown + YAML front matter，subagent 工具调度子 Agent"

# ─── Agent 定义文件格式 ───
agent_format:
      type: markdown_yaml_frontmatter
      output_dir: .pi/agents/
      file_extension: .md

# ─── Front matter 配置 ───
front_matter:
      enabled: true
      # Pi subagent 扩展的 front matter 字段：name/description/tools
      # 当前从现有 .pi/agents/ 提取（如果存在），未来独立配置化
      source: template

      template:
            roles:
                  advisor: |
                        name: advisor
                        {{DESCRIPTION}}
                        tools:
                        - read
                        - write
                        - fetch_content
                  agent-manager: |
                        name: agent-manager
                        {{DESCRIPTION}}
                        tools:
                        - read
                        - edit
                        - write
                  dev: |
                        name: dev
                        {{DESCRIPTION}}
                        tools:
                        - read
                        - edit
                        - write
                        - bash
                        - fetch_content
                  finance: |
                        name: finance
                        {{DESCRIPTION}}
                        tools:
                        - read
                        - write
                        - fetch_content
                  growth: |
                        name: growth
                        {{DESCRIPTION}}
                        tools:
                        - read
                        - write
                        - fetch_content
                  guardian: |
                        name: guardian
                        {{DESCRIPTION}}
                        tools:
                        - read
                        - write
                        - bash
                        - fetch_content
                  product: |
                        name: product
                        {{DESCRIPTION}}
                        tools:
                        - read
                        - write
                        - edit
                        - fetch_content
                  qa: |
                        name: qa
                        {{DESCRIPTION}}
                        tools:
                        - read
                        - write
                        - bash
                  ui-ux: |
                        name: ui-ux
                        {{DESCRIPTION}}
                        tools:
                        - read
                        - fetch_content
                  director: |
                        name: director
                        {{DESCRIPTION}}
                        tools:
                        - read
                        - write
                        - edit
                        - bash
                        - subagent
                        - fetch_content
path_replace:
      default:
            - from: "{{WORK_PATH}}/"
              to: "$OPC_WORK_PATH/"
      overrides:
            director:
                  # feedback.schema.json 在根目录，agents/ 目录深两层，需 ../../
                  - from: "feedback.schema.json"
                    to: "../../feedback.schema.json"

# ─── 章节处理规则 ───
sections:
      # Pi 版保留"能力边界"章节（Pi 没有 front matter skills 机制）
      remove: []
      inject:
            - position: after_front_matter
              content: |
                    > 📖 此文件 mirror `prompts/{{role}}.md`。完整内容以 prompts/ 为准。

# ─── prompts 源文件预处理 ───
source_preprocess:
      strip_leading_front_matter: true

# ─── Director 入口文件配置 ───
director_entry:
      file: .pi/SYSTEM.md
      type: markdown
      # Pi 的 Director 入口是 .pi/SYSTEM.md，当前手动维护
      source: manual

# ─── 调度方式 ───
scheduling:
      type: subagent_tool
      description: "Pi 运行时：主 Agent 调度 OPC 子 Agent 必须用 subagent 工具（single/parallel/chain），禁止用 herdr 工具。子 Agent 定义在 .pi/agents/"

# ─── 文件保护机制 ───
file_protection:
      mechanism: permission_system
      config: .pi/config.json

# ─── 检测规则 ───
detect:
      command: pi
      directory: .pi
      config: .pi/config.json
