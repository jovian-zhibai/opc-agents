# OPC 运行时适配配置 — OpenCode
# 此配置定义如何从 prompts/（唯一真相源）生成 OpenCode 运行时的 Agent 定义文件。
# 生成器：scripts/generate-agents.py --runtime=opencode

runtime: opencode
name: OpenCode
description: "OpenCode 运行时适配 — markdown + YAML front matter，@提及/Tab 调度"

# ─── Agent 定义文件格式 ───
agent_format:
  type: markdown_yaml_frontmatter  # markdown_yaml_frontmatter / toml / plain_markdown
  output_dir: .opencode/agents/
  file_extension: .md

# ─── Front matter 配置 ───
front_matter:
  enabled: true
  # 来源：template（从下方配置生成，单源模式，删了产物也能复原）
  #       existing（从现有 .opencode/agents/<role>.md 提取，已淘汰）
  source: template
  template:
    roles:
      advisor: |
        mode: all
        temperature: 0.3
        steps: 30
        tools:
          read: true
          write: true
          edit: false
          bash: false
          webfetch: true
        permission:
          bash: "deny"
          edit: "deny"
          webfetch: "allow"
        skills:
          - brainstorming
          - deep-research
          - market-research
          - anysearch  # 全局依赖（~/.agents/skills/anysearch），OpenCode 本地未安装属预期
          - multi-search-engine  # 全局也未安装，缺失时按降级规则走 webfetch/联网搜索
        version: 1.4
        last_optimized: 2026-07-11
        optimization_log: "v1.4: 裁认知偏差表60行+决策日志模板35行，加克制原则，479→~320行"
      agent-manager: |
        mode: subagent
        temperature: 0.2
        steps: 25
        tools:
          read: true
          edit: true
          write: true
          bash: false
          webfetch: false
        permission:
          bash: "deny"
          webfetch: "deny"
        skills:
          - knowledge-search
        version: 1.0
        last_optimized: 2026-06-22
        optimization_log: "v1.0: 从 Claude Code 版合并，新增 agent-manager 角色"
      dev: |
        mode: subagent
        temperature: 0.2
        steps: 60
        tools:
          read: true
          edit: true
          write: true
          bash: true
          webfetch: true
        permission:
          bash: "allow"
          webfetch: "allow"
        skills:
          - technical-architecture
          - code-review
          - code-simplifier
          - webapp-testing
          - systematic-debugging
          - test-driven-development
        version: 2.6
        last_optimized: 2026-07-11
        optimization_log: "v2.6: 前端职责边界明确(Dev实现UI-UX设计、不做视觉决策、无设计时拒绝)+红线补"
