# OPC 运行时适配配置 — OpenCode
# 此配置定义如何从 prompts/（唯一真相源）生成 OpenCode 运行时的 Agent 定义文件。
# 生成器：scripts/generate-agents.py --runtime=opencode

runtime: opencode
name: OpenCode
description: "OpenCode 运行时适配 — markdown + YAML front matter，@提及/Tab 调度"

# ─── Agent 定义文件格式 ───
agent_format:
  type: markdown_yaml_frontmatter  # markdown_yaml_frontmatter / toml / plain_markdown
  output_dir: .opencode/agents/
  file_extension: .md

# ─── Front matter 配置 ───
front_matter:
  enabled: true
  # 来源：existing（从现有 .opencode/agents/<role>.md 提取，试点阶段）
  #       template（从下方模板生成，未来独立配置化）
  source: existing

# ─── 路径前缀替换规则 ───
# 默认规则 + 按角色覆盖（overrides）
path_replace:
  default:
    - from: "{{WORK_PATH}}/"
      to: ".opencode/work/"
  overrides:
    agent-manager:
      - from: "{{WORK_PATH}}/"
        to: "work/"
    # director 用环境变量 $OPC_WORK_PATH（与其他角色的 .opencode/work/ 不同）
    # routing.yaml / feedback.schema.json 相对路径需要从 ./ 改为 ../../（因为 .opencode/agents/ 比 prompts/ 深两层）
    director:
      - from: "{{WORK_PATH}}/"
        to: "$OPC_WORK_PATH/"
      - from: "../routing.yaml"
        to: "../../routing.yaml"
      - from: "feedback.schema.json"
        to: "../../feedback.schema.json"

# ─── 章节处理规则 ───
sections:
  # 去除的章节（opencode 用 front matter skills 替代正文能力边界）
  remove:
    - "## 能力边界"
  # 注入的内容
  inject:
    - position: after_front_matter  # after_front_matter / before_body / after_body
      content: |
        > 📖 此文件 mirror `prompts/{{role}}.md`。完整内容以 prompts/ 为准。
    - position: after_front_matter
      content: |
        ## 🔄 会话启动自动检查（机制强制，不靠自觉）

        收到任何任务，动手前必须依次执行（每步都是命令，不是建议）：

        1. **任务前查教训**：提取任务关键词，调度 Dev 执行 lessons-index 教训检索（OpenCode 检索脚本为 `.opencode/skills/lessons-index/search.sh`；教训库路径 `$OPC_KNOWLEDGE_PATH/08-Lessons/`，draft 草稿已过滤不参与检索）。如 opc-session-hook 插件已通过 hook 注入教训检索结果，则无需重复执行。
        2. **会话引导**：优先读取 `.opencode/work/session-start-context.md`（如存在，由 opc-session-hook 插件在会话启动时自动生成，含中断恢复+会话引导+流程提醒）；如该文件不存在，读 `work/session-notes.md` 最后 20 行，了解上次干到哪、有什么坑，避免重蹈覆辙
        3. **高危流程提醒**（遇到才生效）：
           - 涉及金钱/定价/预算 → 必须先问创始人，不自行决策
           - 涉及用户可见的界面/文案/交互变化 → 先问创始人确认方向
           - 若需 QA 验证且连续 3 次失败 → 停止并上报创始人，不无限重试

        （本指令由机制强制注入——每次收到任务前执行，不靠记忆）

# ─── prompts 源文件预处理 ───
source_preprocess:
  # 去除 prompts 文件开头的迷你 front matter（如 advisor/product 的 optimization_log 块）
  strip_leading_front_matter: true

# ─── 入口文件配置 ───
entry:
  file: opencode.json
  type: json
  # 入口文件的生成规则（后续处理，当前手动维护）

# ─── 调度方式 ───
scheduling:
  type: mention_tab  # task_tool / mention_tab / dispatch_agent / spawn_subagent
  description: "Tab 切换 primary agents，@提及 subagents"

# ─── 文件保护机制 ───
file_protection:
  mechanism: permission_deny  # pretooluse_hook / permission_deny
  config: opencode.json

# ─── 检测规则（如何判断用户安装了这个工具）───
detect:
  command: opencode       # 检查命令是否存在
  directory: .opencode    # 检查项目级目录是否存在
  config: opencode.json   # 检查配置文件是否存在
