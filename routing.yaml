# OPC 操作归属路由表 — 单一真相源
# 版本: 1.0
# 规则: 三份 director（CLAUDE.md、prompts/director.md、.opencode/agents/director.md）均引用此文件，
#       不得各自手写归属表。修改归属关系只改此处。
#
# 定位: 确定性路由层 — 关键词能明确命中的直接路由；
#       命中不了的显式交回 Director 做意图翻译（见 fallback 字段）。

version: "1.0"
description: "OPC 操作归属路由表"

# ─── Director 豁免项：可自己做，不需调度 ───
exemptions:
  - description: "纯展示查询"
    examples: ["git status", "文件列表", "命令行输出查看"]
  - description: "知识库新笔记"
    examples: ["创建新文件到知识库"]
  - description: "文件重命名/移动"
    examples: ["不改变文件内容的重命名或移动"]
  - description: "push/部署"
    note: "QA 验证后 Director 执行，但部署动作由 Dev 预先准备"

exemption_rule: "判断标准：做错了能否在 10 秒内无损回退？能→自己做，不能→调度。"

# ─── 确定性路由表 ───
routes:
  # ── UI 相关 ──
  - id: "ui-page"
    operation: "做页面/做网站/做前端"
    triggers: ["做页面", "做网站", "做前端", "做界面", "写页面"]
    agent: ["UI-UX", "Dev"]
    sequential: true
    director_action: "先调 UI-UX 出设计，审查后调 Dev 实现"
    note: "串行，不可跳过 UI-UX 直接调 Dev"

  - id: "ui-design"
    operation: "设计 UI/UX/交互"
    triggers: ["设计", "UI", "UX", "交互"]
    agent: "UI-UX"
    sequential: false
    director_action: "调度 UI-UX"

  # ── 代码相关 ──
  - id: "write-code"
    operation: "写代码/改代码"
    triggers: ["修一下", "改一下", "fix", "实现", "开发"]
    agent: "Dev"
    sequential: false
    director_action: "调度 Dev + 审查产出"

  - id: "read-code"
    operation: "读代码/分析代码/解释代码"
    triggers: ["这段代码什么意思", "分析一下", "解释一下"]
    agent: "Dev"
    sequential: false
    director_action: "调度 Dev，把结果转述给创始人"
    note: "Director 自己不读代码——即使是理解项目结构也要调 Dev"

  - id: "commit"
    operation: "commit"
    triggers: ["提交", "commit"]
    agent: "Dev"
    sequential: false
    director_action: "审查 diff 后批准"

  # ── QA 相关 ──
  - id: "bug-triage"
    operation: "Bug 排查/用户报告问题"
    triggers: ["有问题", "不对", "错了", "报错", "bug"]
    agent: ["QA", "Dev"]
    sequential: true
    director_action: "先调 QA 排查确认，再调 Dev 修复"

  - id: "run-test"
    operation: "运行测试"
    triggers: ["测试", "验证", "check", "跑一下测试"]
    agent: "QA"
    sequential: false
    director_action: "调度 QA + 看报告"

  # ── 安全相关 ──
  - id: "security-scan"
    operation: "安全扫描"
    triggers: ["扫描", "安全", "audit", "漏洞"]
    agent: "Guardian"
    sequential: false
    director_action: "调度 Guardian + 看报告"

  # ── 产品相关 ──
  - id: "write-prd"
    operation: "写 PRD/需求分析"
    triggers: ["PRD", "需求", "产品文档"]
    agent: "Product"
    sequential: false
    director_action: "调度 Product"

  # ── 增长相关 ──
  - id: "growth"
    operation: "市场调研/竞品分析/内容策略"
    triggers: ["调研", "竞品", "市场", "内容", "推广"]
    agent: "Growth"
    sequential: false
    director_action: "调度 Growth"

  # ── 财务相关 ──
  - id: "finance"
    operation: "财务分析/定价/记账"
    triggers: ["定价", "财务", "记账", "成本"]
    agent: "Finance"
    sequential: false
    director_action: "调度 Finance"
    note: "需创始人确认"

  # ── Agent 管理 ──
  - id: "edit-prompt"
    operation: "编辑 Agent prompt"
    triggers: ["改 prompt", "优化 agent", "调整 agent"]
    agent: "AgentManager"
    sequential: false
    director_action: "调度 AgentManager"
    note: "P0-1 修正：原两份 director 错误写为 Dev，以 CLAUDE.md:99 为准。AgentManager 负责全生命周期。"

  - id: "agent-lifecycle"
    operation: "Agent 生命周期管理"
    triggers: ["新建 agent", "删除 agent", "合并 agent", "扫描 agent"]
    agent: "AgentManager"
    sequential: false
    director_action: "调度 AgentManager"

  # ── Director 自己做的事 ──
  - id: "push-deploy"
    operation: "push/部署"
    triggers: ["发布", "push", "部署", "上线"]
    agent: "Director"
    sequential: false
    director_action: "QA 验证后 Director 执行 push"
    note: "部署动作由 Dev 预先准备，Director 只执行"

  - id: "knowledge-write"
    operation: "知识库写入"
    triggers: ["记录一下", "写个笔记", "归档"]
    agent: "Director"
    sequential: false
    director_action: "创建新笔记，不编辑已有文件"

  - id: "meeting-minutes"
    operation: "会议纪要"
    triggers: ["会议", "纪要"]
    agent: "Director"
    sequential: false
    director_action: "写会议纪要"

  - id: "task-board"
    operation: "任务面板"
    triggers: ["任务面板", "看板"]
    agent: "Director"
    sequential: false
    director_action: "维护任务面板"

  # Advisor 不走确定性关键词路由。
  # 由 Director 规则触发：会议（必参会）、关键决策（必须发言）、被调用时介入。
  - id: "advisor"
    operation: "分析质疑/决策辅助"
    triggers: []  # 无关键词触发，走 fallback: director-intent
    agent: "Advisor"
    sequential: false
    director_action: "会议/关键决策点必须请 Advisor 发言；被调用时按需介入"
    note: "非确定性路由。不靠关键词命中，由 Director 规则和会议流程触发。"

# ─── 兜底：确定性路由命中不了的，交回 Director 做意图翻译 ───
# Director 的意图翻译能力见 prompts/director.md:13-25：
# "登录页有点丑"→调 UI-UX、"代码跑得通吗"→调 QA——这些是 LLM 做的，不是 keyword dispatch。
fallback: "director-intent"

# ─── Skill 路由表：意图 → 对应 skill ───
# 高频 skill 按意图分组。命中后加载给 Agent 使用。
# 未命中的走 skill-index 检索（search.sh 实时扫描全部 skill）。
skill_routes:
  # 前端开发
  - intent: ["React", "组件", "前端页面", "Vue", "Angular", "UI 组件"]
    skills: ["react-patterns", "frontend-design"]
  - intent: ["CSS", "样式", "布局", "Tailwind", "动画"]
    skills: ["frontend-design", "frontend-design-direction"]

  # 后端/API
  - intent: ["API 设计", "REST", "接口规范", "后端架构"]
    skills: ["api-design", "backend-patterns"]
  - intent: ["Node.js", "Express", "Fastify", "NestJS"]
    skills: ["backend-patterns", "nestjs-patterns"]
  - intent: ["Python", "FastAPI", "Django", "Flask"]
    skills: ["fastapi-patterns", "backend-patterns"]

  # 数据库
  - intent: ["数据库", "SQL", "查询优化", "慢查询", "建表"]
    skills: ["postgres-patterns", "prisma-patterns"]
  - intent: ["ClickHouse", "分析", "OLAP"]
    skills: ["clickhouse-io"]

  # 测试
  - intent: ["测试", "单元测试", "集成测试", "E2E", "自动化测试"]
    skills: ["test-driven-development", "e2e-testing", "browser-qa", "verification-before-completion"]
  - intent: ["调试", "bug", "报错排查", "修 bug"]
    skills: ["systematic-debugging", "code-review"]

  # 安全
  - intent: ["安全", "漏洞", "审计", "渗透", "OWASP"]
    skills: ["security-review", "security-scan"]

  # 设计
  - intent: ["UI 设计", "UX", "原型", "设计稿", "组件库设计"]
    skills: ["ui-ux-designer", "frontend-design"]

  # 内容/文档
  - intent: ["写文章", "博客", "公众号", "教程", "推文", "文案"]
    skills: ["content-engine", "article-writing"]
  - intent: ["文档", "README", "API 文档", "技术文档"]
    skills: ["article-writing", "architecture-decision-records"]

  # 文件处理
  - intent: ["PDF", "生成 PDF", "读取 PDF"]
    skills: ["pdf"]  # Claude Code 专属 skill，OpenCode 环境不可用，OC 下走降级
  - intent: ["Word", "docx", "文档生成"]
    skills: ["docx"]  # Claude Code 专属 skill，OpenCode 环境不可用，OC 下走降级
  - intent: ["Excel", "xlsx", "表格", "CSV"]
    skills: ["xlsx"]  # Claude Code 专属 skill，OpenCode 环境不可用，OC 下走降级
  - intent: ["PPT", "演示文稿", "slides"]
    skills: ["pptx"]  # Claude Code 专属 skill，OpenCode 环境不可用，OC 下走降级

  # 代码审查/质量
  - intent: ["代码审查", "PR review", "代码质量"]
    skills: ["code-review", "code-simplifier"]

  # DevOps
  - intent: ["部署", "Docker", "CI/CD", "上线"]
    skills: ["deployment-patterns", "docker-patterns"]
  - intent: ["监控", "告警", "日志"]
    skills: ["dashboard-builder"]

  # 架构
  - intent: ["架构设计", "系统设计", "技术选型"]
    skills: ["technical-architecture", "architecture-decision-records"]

  # AI/Agent 开发
  - intent: ["Agent 开发", "自主循环", "agent loop", "multi-agent"]
    skills: ["autonomous-loops", "agentic-engineering"]

  # 增长/市场
  - intent: ["增长", "SEO", "转化", "获客", "竞品分析"]
    skills: ["market-research", "content-engine"]

  # 通用技能
  - intent: ["复杂任务", "多步骤", "拆解计划"]
    skills: ["autoplan", "brainstorming"]
  - intent: ["查一下", "搜索", "调研", "最新"]
    skills: ["anysearch", "deep-research"]

# ─── MCP 路由：什么场景用什么 MCP ───
# MCP 提供外部数据/能力，skill 是本地提示词+脚本。互为补充。
mcp_routes:
  # codegraph — 代码图谱分析（依赖关系、调用链、架构可视化）
  - intent: ["依赖关系", "调用链", "代码结构", "模块耦合", "架构图谱"]
    mcp: "codegraph"

  # context7 — 上下文/外部知识注入
  - intent: ["最新文档", "SDK 文档", "官方 API", "库的最新用法", "版本变更"]
    mcp: "context7"

  # obsidian — 知识库读写
  - intent: ["知识库", "笔记", "ADR", "写入 Obsidian", "检索笔记", "每日记录"]
    mcp: "obsidian"
