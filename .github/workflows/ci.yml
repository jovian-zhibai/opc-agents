name: OPC Agents CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check prompts/ integrity
        run: |
          EXPECTED=("advisor" "agent-manager" "dev" "director" "finance" "growth" "guardian" "product" "qa" "ui-ux")
          for name in "${EXPECTED[@]}"; do
            if [ ! -f "prompts/$name.md" ]; then
              echo "ERROR: prompts/$name.md missing"
              exit 1
            fi
          done
          echo "✅ All 10 prompt files present"

      - name: Check entry files
        run: |
          for f in CLAUDE.md opencode.json README.md .env.example; do
            if [ ! -f "$f" ]; then
              echo "ERROR: $f missing"
              exit 1
            fi
          done
          echo "✅ All entry files present"

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "./scripts"
          version: "v0.11.0"

      - name: Run unit tests (pytest)
        run: |
          pip3 install --quiet pytest pyyaml
          python3 -m pytest tests/ -q

      - name: Verify generated agents are in sync with prompts/
        run: |
          # 从 prompts/ 重新生成所有运行时的 Agent 定义，检查是否和仓库中的一致
          # 如果不一致，说明用户改了 prompts/ 但忘了跑生成器（或 pre-commit hook 未生效）
          pip3 install --quiet pyyaml
          for runtime in opencode claude-code pi gemini codex; do
            if [ -f "adapters/${runtime}.yaml" ]; then
              echo "▶ 生成 ${runtime}..."
              python3 scripts/generate-agents.py --runtime="$runtime" --all --write
            fi
          done
          # 检查是否有未提交的变化
          if ! git diff --quiet -- .opencode/agents/ .claude/agents/ .pi/agents/ .gemini/agents/ .codex/agents/; then
            echo "❌ 生成产物与 prompts/ 不同步！"
            echo "   请在本地运行：python3 scripts/generate-agents.py --runtime=opencode --all --write"
            echo "   或配置 git hook：git config core.hooksPath .githooks"
            echo ""
            echo "   差异详情："
            git diff --stat -- .opencode/agents/ .claude/agents/ .pi/agents/ .gemini/agents/ .codex/agents/
            exit 1
          fi
          echo "✅ 所有运行时生成产物与 prompts/ 同步"

      - name: Verify CLAUDE.md entry block is in sync with prompts/
        run: |
          # 从 prompts/director.md 红线节重新生成 CLAUDE.md 标记块，检查是否和仓库中一致
          # 如果不一致，说明改了 prompts/ 红线但忘了同步 CLAUDE.md 标记块
          pip3 install --quiet pyyaml
          python3 scripts/generate-agents.py --entry-block CLAUDE.md --section 红线 --write
          if ! git diff --quiet -- CLAUDE.md; then
            echo "❌ CLAUDE.md 标记块与 prompts/director.md 红线节不同步！"
            echo "   请在本地运行：python3 scripts/generate-agents.py --entry-block CLAUDE.md --section 红线 --write"
            echo ""
            echo "   差异详情："
            git diff -- CLAUDE.md
            exit 1
          fi
          echo "✅ CLAUDE.md 标记块与 prompts/director.md 红线节同步"

      - name: Run quality-gate
        run: bash scripts/quality-gate.sh

      - name: Run skill shell self-tests
        run: |
          # 遍历 .opencode/skills/ 下各 skill 的 test.sh（若有），逐个执行
          for t in .opencode/skills/*/test.sh; do
            [ -f "$t" ] || continue
            echo "▶ 运行 $t"
            bash "$t"
          done

      - name: Check no hardcoded secrets
        run: |
          # 扫描整个仓库『会被提交』的文件集（git tracked + 未忽略的未跟踪），
          # 排除 .env/.env.example（本地配置与占位模板）、node_modules、.git、lock 文件、
          # 以及 quality-gate.sh 自身（正文含正则定义，属自引用误报）。
          FILES=$(git ls-files --cached --others --exclude-standard 2>/dev/null | \
            grep -vE '(^|/)\.env(\.example)?$|node_modules|^\.git/|\.lock$|package-lock\.json$|pnpm-lock\.yaml$|^scripts/quality-gate\.sh$' || true)
          if [ -n "$FILES" ]; then
            # 过滤掉含正则定义字面本身的命中（本文件与 quality-gate.sh 正文含模式文本，属自引用误报）
            if printf '%s\n' "$FILES" | xargs grep -nE 'sk-[A-Za-z0-9]{20,}|api_key=.{10,}|token=.{20,}' 2>/dev/null \
              | grep -vF -e 'sk-[A-Za-z0-9]{20,}' -e 'api_key=.{10,}' -e 'token=.{20,}' \
              -e 'sk-\[A-Za-z0-9\]\{20,\}' -e 'api_key=\.\{10,\}' -e 'token=\.\{20,\}'; then
              echo "ERROR: Hardcoded API key found in tracked files"
              exit 1
            fi
          fi
          echo "✅ No hardcoded secrets found"
